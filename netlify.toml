# Netlify configuration. The site is static (publish dir = repo root, no build step);
# the two serverless functions under netlify/functions power the Insights mailing list.
# Secrets (RESEND_API_KEY, RESEND_SEGMENT_EN, RESEND_SEGMENT_FR, UNSUBSCRIBE_SECRET)
# are set in the Netlify UI: Site configuration -> Environment variables.

[build]
  publish = "."
  functions = "netlify/functions"
  # Every production deploy costs 15 of the 300 monthly free credits. Skip the deploy when
  # the commit only touched files the live site does not serve (workflow, scripts, docs).
  # Exit 0 = skip build, exit 1 = build. (`git diff --quiet` exits 0 when nothing changed.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!.github' ':!scripts' ':!routine' ':!README.md' ':!.gitignore'"

[functions]
  node_bundler = "esbuild"
